name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Northstar.Libraries.slnx
      - run: dotnet build Northstar.Libraries.slnx --no-restore -c Release
      - run: dotnet test Northstar.Libraries.slnx --no-build -c Release --verbosity normal

      # A ProjectReference proves the generator works; it proves nothing about
      # the PACKAGED layout. Get PackagePath wrong and the package restores,
      # builds, and generates nothing. This is the only step that would catch it.
      - name: verify the package as a consumer sees it
        run: bash scripts/verify-package.sh
